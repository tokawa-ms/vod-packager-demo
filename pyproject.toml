[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vod-packager"
version = "0.2.1"
description = "Create multi-bitrate CMAF VoD packages with FFmpeg and Shaka Packager"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "tokawa-ms"}]

[project.scripts]
vod-packager = "vod_packager.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
